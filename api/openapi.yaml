openapi: 3.0.3
info:
  title: Delim Gateway API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Gateway liveness alias
      responses:
        "200": {description: Gateway is running, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
  /health/live:
    get:
      summary: Gateway liveness
      responses:
        "200": {description: Gateway is running, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
  /health/ready:
    get:
      summary: Gateway readiness
      responses:
        "200": {description: Dependencies are available, content: {application/json: {schema: {$ref: "#/components/schemas/ReadyResponse"}}}}
        "503": {description: One or more dependencies are unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/ReadyResponse"}}}}
  /api/v1/auth/max:
    post:
      summary: Create a session from verified MAX initData
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/MAXLoginRequest"}}}
      responses:
        "200": {description: Session created, content: {application/json: {schema: {$ref: "#/components/schemas/MAXLoginResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/me:
    get:
      summary: Get the current Core user
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/groups:
    post:
      summary: Create a group
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateGroupRequest"}}}
      responses:
        "201": {description: Group created, content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      summary: List groups
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses:
        "200": {description: Group page, content: {application/json: {schema: {$ref: "#/components/schemas/GroupList"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/groups/{groupID}/max-chat:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Bind the session's verified MAX chat to the group (owner/admin)
      description: The chat id comes only from the server-verified session context, never from the request body.
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Bound, content: {application/json: {schema: {$ref: "#/components/schemas/MAXChatBinding"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    get:
      summary: Get the group's MAX chat binding
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Binding state, content: {application/json: {schema: {$ref: "#/components/schemas/MAXChatBindingState"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      summary: Unbind the group's MAX chat (owner/admin)
      security: [{BearerAuth: []}]
      responses:
        "204": {description: Unbound}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/groups/{groupID}/max-chat/sync:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Synchronize MAX chat members into the group (owner/admin)
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Sync result, content: {application/json: {schema: {$ref: "#/components/schemas/MAXChatSyncResult"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Bot admin required / chat not bound / chat not active, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/groups/{groupID}:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    get:
      summary: Get a group
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Group, content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{groupID}/join:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Join a group
      description: Requires a session issued from a valid invitation for this group. Repeated joins are idempotent.
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Membership, content: {application/json: {schema: {$ref: "#/components/schemas/GroupMember"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupID}/members:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    get:
      summary: List group members
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Members, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/GroupMember"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      summary: Add group members
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AddGroupMembersRequest"}}}
      responses:
        "200": {description: Added members, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/GroupMember"}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupID}/members/{userID}/role:
    parameters: [{$ref: "#/components/parameters/GroupID"}, {$ref: "#/components/parameters/UserID"}]
    patch:
      summary: Update a group member role
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpdateMemberRoleRequest"}}}
      responses:
        "200": {description: Updated membership, content: {application/json: {schema: {$ref: "#/components/schemas/GroupMember"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupID}/archive:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Archive a group
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Archived group, content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupID}/expenses:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Create an expense
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExpenseInput"}}}
      responses:
        "201": {description: Expense created, content: {application/json: {schema: {$ref: "#/components/schemas/Expense"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    get:
      summary: List group expenses
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses:
        "200": {description: Expense page, content: {application/json: {schema: {$ref: "#/components/schemas/ExpenseList"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/expenses/{expenseID}:
    parameters: [{$ref: "#/components/parameters/ExpenseID"}]
    get:
      summary: Get an expense
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Expense, content: {application/json: {schema: {$ref: "#/components/schemas/Expense"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Update an expense
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpdateExpenseRequest"}}}
      responses:
        "200": {description: Updated expense, content: {application/json: {schema: {$ref: "#/components/schemas/Expense"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/expenses/{expenseID}/confirm:
    parameters: [{$ref: "#/components/parameters/ExpenseID"}]
    post:
      summary: Confirm an expense
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Confirmed expense, content: {application/json: {schema: {$ref: "#/components/schemas/Expense"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/expenses/{expenseID}/cancel:
    parameters: [{$ref: "#/components/parameters/ExpenseID"}]
    post:
      summary: Cancel an expense
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Cancelled expense, content: {application/json: {schema: {$ref: "#/components/schemas/Expense"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupID}/balance:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    get:
      summary: Get group balances
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Balances, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Balance"}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/groups/{groupID}/balance/{userID}:
    parameters: [{$ref: "#/components/parameters/GroupID"}, {$ref: "#/components/parameters/UserID"}]
    get:
      summary: Get a user's balance breakdown
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Balance breakdown, content: {application/json: {schema: {$ref: "#/components/schemas/BalanceBreakdown"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/groups/{groupID}/settlement-plan:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    get:
      summary: Get a suggested settlement plan
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Suggested transfers, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SettlementPlanTransfer"}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/groups/{groupID}/settlements:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Create a settlement
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateSettlementRequest"}}}
      responses:
        "201": {description: Settlement created, content: {application/json: {schema: {$ref: "#/components/schemas/Settlement"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    get:
      summary: List group settlements
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses:
        "200": {description: Settlement page, content: {application/json: {schema: {$ref: "#/components/schemas/SettlementList"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settlements/{settlementID}/confirm:
    parameters: [{$ref: "#/components/parameters/SettlementID"}]
    post:
      summary: Confirm a settlement
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Confirmed settlement, content: {application/json: {schema: {$ref: "#/components/schemas/Settlement"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/expenses/{expenseID}/adjustments:
    parameters: [{$ref: "#/components/parameters/ExpenseID"}]
    post:
      summary: Create an expense adjustment
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateAdjustmentRequest"}}}
      responses:
        "201": {description: Adjustment created, content: {application/json: {schema: {$ref: "#/components/schemas/Adjustment"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    get:
      summary: List expense adjustments
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Adjustments, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Adjustment"}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/groups/{groupID}/invite:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Create a signed group invitation
      description: Only the group owner or an administrator can issue an invitation.
      security: [{BearerAuth: []}]
      responses:
        "201": {description: Invitation created, content: {application/json: {schema: {$ref: "#/components/schemas/Invite"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/groups/{groupID}/receipts:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Upload one receipt image and queue OCR
      description: Accepts exactly one JPEG, PNG, or WebP file up to the configured upload limit.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/ReceiptUpload"}
      responses:
        "201": {description: Receipt stored and OCR job queued, content: {application/json: {schema: {$ref: "#/components/schemas/CreateReceiptResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/receipts/{receiptID}:
    parameters: [{$ref: "#/components/parameters/ReceiptID"}]
    get:
      summary: Get receipt metadata
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Receipt metadata, content: {application/json: {schema: {$ref: "#/components/schemas/Receipt"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
    delete:
      summary: Soft-delete a receipt and its stored image
      security: [{BearerAuth: []}]
      responses:
        "204": {description: Receipt deleted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/document-jobs/{jobID}:
    parameters: [{$ref: "#/components/parameters/JobID"}]
    get:
      summary: Get OCR job status
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Document job, content: {application/json: {schema: {$ref: "#/components/schemas/DocumentJob"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/receipts/{receiptID}/ocr:
    parameters: [{$ref: "#/components/parameters/ReceiptID"}]
    get:
      summary: Get the current OCR view for a receipt
      description: Before OCR completes, the response contains the receipt status and an empty items array.
      security: [{BearerAuth: []}]
      responses:
        "200": {description: OCR status and extracted data, content: {application/json: {schema: {$ref: "#/components/schemas/OCRResult"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/receipts/{receiptID}/retry:
    parameters: [{$ref: "#/components/parameters/ReceiptID"}]
    post:
      summary: Retry OCR for a failed receipt
      security: [{BearerAuth: []}]
      responses:
        "200": {description: New OCR job, content: {application/json: {schema: {$ref: "#/components/schemas/DocumentJob"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/groups/{groupID}/exports:
    parameters: [{$ref: "#/components/parameters/GroupID"}]
    post:
      summary: Build a group operations export
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateExportRequest"}}}
      responses:
        "201": {description: Export created, content: {application/json: {schema: {$ref: "#/components/schemas/Export"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/exports/{exportID}:
    parameters: [{$ref: "#/components/parameters/ExportID"}]
    get:
      summary: Get export metadata
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Export metadata, content: {application/json: {schema: {$ref: "#/components/schemas/Export"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/exports/{exportID}/download:
    parameters: [{$ref: "#/components/parameters/ExportID"}]
    get:
      summary: Stream a ready export
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Export file
          headers:
            Content-Disposition:
              description: Attachment filename
              schema: {type: string}
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
  /api/v1/max/webhook:
    post:
      summary: Receive a MAX update
      parameters:
        - {name: X-Max-Bot-Api-Secret, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        "200": {description: Update accepted, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer}
  parameters:
    GroupID: {name: groupID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    UserID: {name: userID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ExpenseID: {name: expenseID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    SettlementID: {name: settlementID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ReceiptID: {name: receiptID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    JobID: {name: jobID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ExportID: {name: exportID, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    Limit: {name: limit, in: query, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: integer, format: int64, minimum: 0}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    Conflict: {description: Conflict or failed precondition, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    PayloadTooLarge: {description: Request payload is too large, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    TooManyRequests: {description: Resource exhausted, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    ServiceUnavailable: {description: Service unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    GatewayTimeout: {description: Downstream timeout, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    InternalError: {description: Internal server error, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
  schemas:
    Currency: {type: string, minLength: 3, maxLength: 3, example: RUB}
    MoneyMinor: {type: integer, format: int64, description: Amount in minor currency units, example: 10000}
    MemberRole: {type: string, enum: [owner, admin, member]}
    GroupStatus: {type: string, enum: [active, archived]}
    SplitType: {type: string, enum: [equal, fixed, shares, percentage, item]}
    ExpenseStatus: {type: string, enum: [pending, confirmed, cancelled]}
    SettlementStatus: {type: string, enum: [pending, confirmed, cancelled]}
    AdjustmentType: {type: string, enum: [refund, correction]}
    ReceiptStatus: {type: string, enum: [uploaded, queued, processing, ready, failed, deleted]}
    DocumentJobStatus: {type: string, enum: [pending, processing, completed, failed]}
    ExportFormat: {type: string, enum: [csv, pdf, xlsx]}
    ExportStatus: {type: string, enum: [pending, processing, ready, failed]}
    StatusResponse:
      type: object
      required: [status]
      properties: {status: {type: string, example: ok}}
    ReadyResponse:
      type: object
      required: [status, core, document, postgres]
      properties:
        status: {type: string, enum: [ok, unavailable]}
        core: {type: string, enum: [ok, unavailable]}
        document: {type: string, enum: [ok, unavailable]}
        postgres: {type: string, enum: [ok, unavailable]}
    MAXLoginRequest:
      type: object
      additionalProperties: false
      required: [init_data]
      properties: {init_data: {type: string}}
    MAXLoginResponse:
      type: object
      required: [token, expires_in, user]
      properties:
        token: {type: string}
        expires_in: {type: integer, format: int64}
        user: {$ref: "#/components/schemas/MAXLoginUser"}
        start_param: {type: string}
        invite: {$ref: "#/components/schemas/MAXLoginInvite"}
        launch: {$ref: "#/components/schemas/MAXLaunch"}
    MAXLaunch:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [group, new_expense, balance, expense, settlement]}
        group_id: {type: integer, format: int64}
        entity_id: {type: integer, format: int64}
    MAXLoginUser:
      type: object
      required: [id, max_user_id]
      properties:
        id: {type: integer, format: int64}
        max_user_id: {type: integer, format: int64}
    MAXLoginInvite:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [invalid, expired, unavailable, join_failed, joined]}
        group_id: {type: integer, format: int64}
        expires_at: {type: string, format: date-time}
    Invite:
      type: object
      required: [start_param, expires_at]
      properties:
        start_param: {type: string, description: Signed value accepted as MAX start_param}
        deep_link: {type: string, format: uri, description: Present when MAX bot username is configured}
        expires_at: {type: string, format: date-time}
    User:
      type: object
      required: [id, max_user_id, first_name, last_name, username]
      properties:
        id: {type: integer, format: int64}
        max_user_id: {type: integer, format: int64}
        first_name: {type: string}
        last_name: {type: string}
        username: {type: string}
        max_chat_id: {type: integer, format: int64, description: Verified MAX chat id when the session was opened from a chat; never client-supplied}
    MAXChatBinding:
      type: object
      required: [chat_id, group_id, bound_by_user_id, status]
      properties:
        chat_id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        bound_by_user_id: {type: integer, format: int64}
        status: {type: string, enum: [active, unbound]}
        current_chat: {type: boolean}
        chat_active: {type: boolean}
    MAXChatBindingState:
      type: object
      required: [bound]
      properties:
        bound: {type: boolean}
        role_can_manage: {type: boolean}
    MAXChatSyncResult:
      type: object
      required: [discovered, added, already_present, unavailable]
      properties:
        discovered: {type: integer, format: int64}
        added: {type: integer, format: int64}
        already_present: {type: integer, format: int64}
        unavailable: {type: integer, format: int64}
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string}}
    Group:
      type: object
      required: [id, name, owner_id, status, current_user_role, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        owner_id: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/GroupStatus"}
        current_user_role: {$ref: "#/components/schemas/MemberRole"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    GroupList:
      type: object
      required: [groups]
      properties:
        groups: {type: array, items: {$ref: "#/components/schemas/Group"}}
        next_cursor: {type: integer, format: int64}
    GroupMember:
      type: object
      required: [group_id, user_id, role, joined_at]
      properties:
        group_id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        role: {$ref: "#/components/schemas/MemberRole"}
        joined_at: {type: string, format: date-time}
        user: {$ref: "#/components/schemas/User"}
    AddGroupMembersRequest:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids: {type: array, minItems: 1, items: {type: integer, format: int64, minimum: 1}}
    UpdateMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties: {role: {$ref: "#/components/schemas/MemberRole"}}
    SplitParticipant:
      type: object
      required: [user_id]
      properties:
        user_id: {type: integer, format: int64}
        value: {type: integer, format: int64}
    ExpenseItemInput:
      type: object
      required: [name, amount_minor, participant_user_ids]
      properties:
        name: {type: string}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        participant_user_ids: {type: array, items: {type: integer, format: int64}}
    ExpenseInput:
      type: object
      additionalProperties: false
      required: [payer_user_id, amount_minor, currency, description, expense_date, split_type, participants, items]
      properties:
        group_id: {type: integer, format: int64, description: Required inside expense when updating}
        payer_user_id: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
        description: {type: string}
        expense_date: {type: string, format: date-time}
        split_type: {$ref: "#/components/schemas/SplitType"}
        participants: {type: array, items: {$ref: "#/components/schemas/SplitParticipant"}}
        items: {type: array, items: {$ref: "#/components/schemas/ExpenseItemInput"}}
    UpdateExpenseRequest:
      type: object
      additionalProperties: false
      required: [version, expense]
      properties:
        version: {type: integer, format: int64, minimum: 1}
        expense: {$ref: "#/components/schemas/ExpenseInput"}
    ExpenseItem:
      type: object
      required: [id, expense_id, name, amount_minor, position]
      properties:
        id: {type: integer, format: int64}
        expense_id: {type: integer, format: int64}
        name: {type: string}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        position: {type: integer, format: int32}
    Allocation:
      type: object
      required: [id, expense_id, user_id, amount_minor]
      properties:
        id: {type: integer, format: int64}
        expense_id: {type: integer, format: int64}
        expense_item_id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
    Expense:
      type: object
      required: [id, group_id, payer_user_id, created_by, amount_minor, currency, description, expense_date, split_type, status, version, created_at, updated_at, items, allocations]
      properties:
        id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        payer_user_id: {type: integer, format: int64}
        created_by: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
        description: {type: string}
        expense_date: {type: string, format: date-time}
        split_type: {$ref: "#/components/schemas/SplitType"}
        status: {$ref: "#/components/schemas/ExpenseStatus"}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        items: {type: array, items: {$ref: "#/components/schemas/ExpenseItem"}}
        allocations: {type: array, items: {$ref: "#/components/schemas/Allocation"}}
    ExpenseList:
      type: object
      required: [expenses]
      properties:
        expenses: {type: array, items: {$ref: "#/components/schemas/Expense"}}
        next_cursor: {type: integer, format: int64}
    Balance:
      type: object
      required: [user_id, currency, net_amount_minor]
      properties:
        user_id: {type: integer, format: int64}
        currency: {$ref: "#/components/schemas/Currency"}
        net_amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
    BalanceEntry:
      type: object
      required: [operation_type, operation_id, currency, amount_minor, occurred_at]
      properties:
        operation_type: {type: string}
        operation_id: {type: integer, format: int64}
        currency: {$ref: "#/components/schemas/Currency"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        occurred_at: {type: string, format: date-time}
    BalanceBreakdown:
      type: object
      required: [balance, entries]
      properties:
        balance: {type: array, items: {$ref: "#/components/schemas/Balance"}}
        entries: {type: array, items: {$ref: "#/components/schemas/BalanceEntry"}}
    SettlementPlanTransfer:
      type: object
      required: [from_user_id, to_user_id, amount_minor, currency]
      properties:
        from_user_id: {type: integer, format: int64}
        to_user_id: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
    CreateSettlementRequest:
      type: object
      additionalProperties: false
      required: [sender_user_id, receiver_user_id, amount_minor, currency]
      properties:
        sender_user_id: {type: integer, format: int64}
        receiver_user_id: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
    Settlement:
      type: object
      required: [id, group_id, sender_user_id, receiver_user_id, amount_minor, currency, status, created_by, version, created_at]
      properties:
        id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        sender_user_id: {type: integer, format: int64}
        receiver_user_id: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
        status: {$ref: "#/components/schemas/SettlementStatus"}
        created_by: {type: integer, format: int64}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        confirmed_at: {type: string, format: date-time}
    SettlementList:
      type: object
      required: [settlements]
      properties:
        settlements: {type: array, items: {$ref: "#/components/schemas/Settlement"}}
        next_cursor: {type: integer, format: int64}
    AdjustmentAllocation:
      type: object
      required: [user_id, amount_minor]
      properties:
        user_id: {type: integer, format: int64}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
    CreateAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [type, amount_minor, currency, allocations]
      properties:
        type: {$ref: "#/components/schemas/AdjustmentType"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
        allocations: {type: array, items: {$ref: "#/components/schemas/AdjustmentAllocation"}}
    Adjustment:
      type: object
      required: [id, group_id, expense_id, type, amount_minor, currency, created_by, created_at, allocations]
      properties:
        id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        expense_id: {type: integer, format: int64}
        type: {$ref: "#/components/schemas/AdjustmentType"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        allocations: {type: array, items: {$ref: "#/components/schemas/AdjustmentAllocation"}}
    ReceiptUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, or WebP receipt image
    CreateReceiptResponse:
      type: object
      required: [receipt, job]
      properties:
        receipt: {$ref: "#/components/schemas/Receipt"}
        job: {$ref: "#/components/schemas/DocumentJob"}
    Receipt:
      type: object
      required: [id, group_id, filename, content_type, size_bytes, status, created_at]
      properties:
        id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        filename: {type: string}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size_bytes: {type: integer, format: int64, minimum: 1}
        status: {$ref: "#/components/schemas/ReceiptStatus"}
        created_at: {type: string, format: date-time}
    DocumentJob:
      type: object
      required: [id, receipt_id, type, status, created_at]
      properties:
        id: {type: integer, format: int64}
        receipt_id: {type: integer, format: int64}
        type: {type: string, enum: [ocr]}
        status: {$ref: "#/components/schemas/DocumentJobStatus"}
        error_code: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    OCRResult:
      type: object
      required: [status, items, confidence, qr_found]
      properties:
        status: {$ref: "#/components/schemas/ReceiptStatus"}
        merchant: {type: string}
        date: {type: string, format: date-time}
        total_minor: {$ref: "#/components/schemas/MoneyMinor"}
        currency: {$ref: "#/components/schemas/Currency"}
        items: {type: array, items: {$ref: "#/components/schemas/OCRItem"}}
        confidence: {type: number, format: float, minimum: 0, maximum: 1}
        qr_found: {type: boolean}
    OCRItem:
      type: object
      required: [name, amount_minor, confidence]
      properties:
        name: {type: string}
        quantity: {type: string, description: Decimal quantity preserved without floating-point loss}
        unit_price_minor: {$ref: "#/components/schemas/MoneyMinor"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        confidence: {type: number, format: float, minimum: 0, maximum: 1}
    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: {$ref: "#/components/schemas/ExportFormat"}
    Export:
      type: object
      required: [id, group_id, format, status, filename, created_at]
      properties:
        id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        format: {$ref: "#/components/schemas/ExportFormat"}
        status: {$ref: "#/components/schemas/ExportStatus"}
        filename: {type: string}
        error_code: {type: string}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
