app:
  name: document
  env: local

grpc:
  host: 0.0.0.0
  port: 50052

postgres:
  host: postgres
  port: 5432
  database: delim
  sslmode: disable
  min_connections: 1
  max_connections: 10

storage:
  endpoint: minio:9000
  bucket: receipts
  use_ssl: false

upload:
  max_size_mb: 10

worker:
  concurrency: 1
  poll_interval_ms: 500
  max_attempts: 3
  retry_base_seconds: 2
  stale_after_minutes: 10

ocr:
  language: ru
  confidence_threshold: 0.45

# Optional third-party lookup of verified receipt positions. Without a token,
# Document keeps using the local OCR pipeline only.
receipt_lookup:
  endpoint: https://proverkacheka.com/api/v1/check/get
  timeout_seconds: 10
  max_response_bytes: 1048576
  max_attempts: 5
  retry_delay_code_2_seconds: 2
  retry_delay_code_4_seconds: 8

metrics:
  host: 0.0.0.0
  port: 9092

privacy:
  receipt_retention_days: 30
  cleanup_interval_minutes: 360
  cleanup_batch_size: 200
