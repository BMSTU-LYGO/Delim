app:
  name: gateway
  env: local

http:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  max_header_bytes: 1048576
  cors_allowed_origins:
    - http://localhost:5173
    - http://localhost:5179
    - http://localhost:8081

grpc:
  core_addr: core:50051
  document_addr: document:50052

document:
  upload_max_size_mb: 10

auth:
  session_ttl: 24h

invite:
  ttl: 24h

launch:
  ttl: 15m

max:
  api_url: https://platform-api2.max.ru
  init_data_ttl: 10m
  bot_username: ""
  mini_app_url: ""

postgres:
  host: postgres
  port: 5432
  database: delim
  sslmode: disable
  max_connections: 10

metrics:
  host: 0.0.0.0
  port: 9090

rate_limit:
  auth_per_minute: 60
  webhook_per_minute: 300
  upload_per_minute: 30
  api_per_minute: 300
  max_keys: 10000
