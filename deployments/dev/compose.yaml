services:
  miniapp:
    build:
      context: ../..
      dockerfile: build/Dockerfile.web
    environment:
      DELIM_GATEWAY_URL: ${DELIM_GATEWAY_URL:-http://localhost:8080}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - 8081:80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: always

  gateway:
    build:
      context: ../..
      dockerfile: build/Dockerfile
      args:
        SERVICE: gateway
    command: ["configs/gateway.yaml"]
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
    depends_on:
      core:
        condition: service_healthy
      document:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 8080:8080
      - 9090:9090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always

  core:
    build:
      context: ../..
      dockerfile: build/Dockerfile
      args:
        SERVICE: core
    command: ["configs/core.yaml"]
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 50051:50051
      - 9091:9091
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always

  document:
    build:
      context: ../..
      dockerfile: build/Dockerfile.document
    command: ["configs/document.yaml"]
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 50052:50052
      - 9092:9092
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import grpc;
          from proto.document.v1 import document_pb2, document_pb2_grpc;
          channel = grpc.insecure_channel('127.0.0.1:50052');
          response = document_pb2_grpc.DocumentServiceStub(channel).Ping(document_pb2.PingRequest(), timeout=2);
          assert response.status == 'ok';
          channel.close()
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: always

  postgres:
    image: postgres:17-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: delim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d delim"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    env_file:
      - ../../.env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - ../../.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
       - >-
         mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
         mc mb --ignore-existing local/receipts &&
         mc anonymous set private local/receipts
    restart: "no"

volumes:
  postgres-data:
  minio-data:
