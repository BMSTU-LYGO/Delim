services:
  gateway:
    build:
      context: ../..
      dockerfile: build/Dockerfile
      args:
        SERVICE: gateway
    command: ["configs/gateway.yaml"]
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8080:8080
    restart: always

  core:
    build:
      context: ../..
      dockerfile: build/Dockerfile
      args:
        SERVICE: core
    command: ["configs/core.yaml"]
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 50051:50051
    restart: always

  document:
    build:
      context: ../..
      dockerfile: build/Dockerfile
      args:
        SERVICE: document
    command: ["configs/document.yaml"]
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 50052:50052
    restart: always

  postgres:
    image: postgres:17-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: delim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d delim"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    env_file:
      - ../../.env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - ../../.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/receipts
    restart: "no"

volumes:
  postgres-data:
  minio-data:
