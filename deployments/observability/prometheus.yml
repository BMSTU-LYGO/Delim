global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: core
    static_configs:
      - targets: ["core:9091"]

  - job_name: document
    static_configs:
      - targets: ["document:9092"]
