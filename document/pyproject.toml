[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delim-document"
version = "0.1.0"
description = "Delim internal document service"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "grpcio==1.80.0",
    "grpcio-tools==1.80.0",
    "minio>=7.2,<8",
    "numpy==2.3.5",
    "openpyxl==3.1.5",
    "opencv-python-headless==4.10.0.84",
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "Pillow==12.3.0",
    "prometheus-client>=0.20,<1",
    "protobuf==6.31.1",
    "PyYAML>=6.0,<7",
    "reportlab==5.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["delim_document*"]
