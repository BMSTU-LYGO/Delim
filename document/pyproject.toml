[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delim-document"
version = "0.1.0"
description = "Delim internal document service"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "grpcio>=1.70,<2",
    "grpcio-tools>=1.70,<2",
    "minio>=7.2,<8",
    "protobuf>=5.29,<7",
    "PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["delim_document*"]
