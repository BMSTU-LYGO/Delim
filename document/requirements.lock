# Pinned, CPU-only dependency combination for the Document service (Block 2.2).
# Regenerate/verify with: docker compose ... exec document pip freeze
#
# Direct set frozen to the versions validated by `make document-ocr-check` /
# `make document-ocr-diagnose`. Install for a reproducible build:
#   pip install -r document/requirements.lock
#
# Platform note: native PaddleOCR CPU inference is verified on linux/x86_64.
# On hosts without a stable Paddle CPU wheel (e.g. linux/aarch64) inference
# crashes natively (SIGSEGV); Document must therefore isolate OCR in a
# subprocess (Block 2.3) and surface degraded OCR instead of dying (Block 2.4).
