syntax = "proto3";
package delim.core.v1;
option go_package = "delim/pkg/gen/core/v1;corev1";
import "google/protobuf/timestamp.proto";

enum AdjustmentType { ADJUSTMENT_TYPE_UNSPECIFIED = 0; ADJUSTMENT_TYPE_REFUND = 1; ADJUSTMENT_TYPE_CORRECTION = 2; }
message AdjustmentAllocation { int64 user_id = 1; int64 amount_minor = 2; }
message Adjustment { int64 id = 1; int64 group_id = 2; int64 expense_id = 3; AdjustmentType type = 4; int64 amount_minor = 5; string currency = 6; int64 created_by = 7; google.protobuf.Timestamp created_at = 8; repeated AdjustmentAllocation allocations = 9; }
message CreateAdjustmentRequest { int64 actor_user_id = 1; int64 expense_id = 2; AdjustmentType type = 3; int64 amount_minor = 4; string currency = 5; repeated AdjustmentAllocation allocations = 6; }
message CreateAdjustmentResponse { Adjustment adjustment = 1; }
message ListAdjustmentsRequest { int64 actor_user_id = 1; int64 expense_id = 2; }
message ListAdjustmentsResponse { repeated Adjustment adjustments = 1; }
