syntax = "proto3";
package delim.core.v1;
option go_package = "delim/pkg/gen/core/v1;corev1";
import "proto/core/v1/common.proto";

enum SplitType { SPLIT_TYPE_UNSPECIFIED = 0; SPLIT_TYPE_EQUAL = 1; SPLIT_TYPE_FIXED = 2; SPLIT_TYPE_SHARES = 3; SPLIT_TYPE_PERCENTAGE = 4; SPLIT_TYPE_ITEM = 5; }
enum ExpenseStatus { EXPENSE_STATUS_UNSPECIFIED = 0; EXPENSE_STATUS_PENDING = 1; EXPENSE_STATUS_CONFIRMED = 2; EXPENSE_STATUS_CANCELLED = 3; }
message SplitParticipant { int64 user_id = 1; int64 value = 2; }
message ExpenseItemInput { string name = 1; int64 amount_minor = 2; repeated int64 participant_user_ids = 3; }
message ExpenseInput { int64 group_id = 1; int64 payer_user_id = 2; int64 amount_minor = 3; string currency = 4; string description = 5; int64 expense_date_unix = 6; SplitType split_type = 7; repeated SplitParticipant participants = 8; repeated ExpenseItemInput items = 9; }
message ExpenseItem { int64 id = 1; int64 expense_id = 2; string name = 3; int64 amount_minor = 4; int32 position = 5; }
message Allocation { int64 id = 1; int64 expense_id = 2; int64 expense_item_id = 3; int64 user_id = 4; int64 amount_minor = 5; }
message Expense { int64 id = 1; int64 group_id = 2; int64 payer_user_id = 3; int64 created_by = 4; int64 amount_minor = 5; string currency = 6; string description = 7; int64 expense_date_unix = 8; SplitType split_type = 9; ExpenseStatus status = 10; int64 version = 11; int64 created_at_unix = 12; int64 updated_at_unix = 13; repeated ExpenseItem items = 14; repeated Allocation allocations = 15; }
message CreateExpenseRequest { int64 actor_user_id = 1; ExpenseInput expense = 2; }
message CreateExpenseResponse { Expense expense = 1; }
message GetExpenseRequest { int64 actor_user_id = 1; int64 expense_id = 2; }
message GetExpenseResponse { Expense expense = 1; }
message ListExpensesRequest { int64 actor_user_id = 1; int64 group_id = 2; PageRequest page = 3; }
message ListExpensesResponse { repeated Expense expenses = 1; PageResponse page = 2; }
message UpdateExpenseRequest { int64 actor_user_id = 1; int64 expense_id = 2; int64 version = 3; ExpenseInput expense = 4; }
message UpdateExpenseResponse { Expense expense = 1; }
message ConfirmExpenseRequest { int64 actor_user_id = 1; int64 expense_id = 2; }
message ConfirmExpenseResponse { Expense expense = 1; }
message CancelExpenseRequest { int64 actor_user_id = 1; int64 expense_id = 2; }
message CancelExpenseResponse { Expense expense = 1; }
