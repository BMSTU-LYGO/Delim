syntax = "proto3";
package delim.core.v1;
option go_package = "delim/pkg/gen/core/v1;corev1";
import "proto/core/v1/common.proto";

enum SettlementStatus { SETTLEMENT_STATUS_UNSPECIFIED = 0; SETTLEMENT_STATUS_PENDING = 1; SETTLEMENT_STATUS_CONFIRMED = 2; SETTLEMENT_STATUS_CANCELLED = 3; }
message Settlement { int64 id = 1; int64 group_id = 2; int64 sender_user_id = 3; int64 receiver_user_id = 4; int64 amount_minor = 5; string currency = 6; SettlementStatus status = 7; int64 created_by = 8; int64 version = 9; int64 created_at_unix = 10; int64 confirmed_at_unix = 11; }
message CreateSettlementRequest { int64 actor_user_id = 1; int64 group_id = 2; int64 sender_user_id = 3; int64 receiver_user_id = 4; int64 amount_minor = 5; string currency = 6; }
message CreateSettlementResponse { Settlement settlement = 1; }
message ConfirmSettlementRequest { int64 actor_user_id = 1; int64 settlement_id = 2; }
message ConfirmSettlementResponse { Settlement settlement = 1; }
message ListSettlementsRequest { int64 actor_user_id = 1; int64 group_id = 2; PageRequest page = 3; }
message ListSettlementsResponse { repeated Settlement settlements = 1; PageResponse page = 2; }
