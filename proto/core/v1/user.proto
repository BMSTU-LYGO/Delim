syntax = "proto3";
package delim.core.v1;
option go_package = "delim/pkg/gen/core/v1;corev1";
import "google/protobuf/timestamp.proto";

message User { int64 id = 1; int64 max_user_id = 2; string first_name = 3; string last_name = 4; string username = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7; }
message UpsertUserRequest { int64 max_user_id = 1; string first_name = 2; string last_name = 3; string username = 4; }
message UpsertUserResponse { User user = 1; }
message GetUserRequest { int64 id = 1; }
message GetUserResponse { User user = 1; }
